# The only configuration file. All values come from environment variables (full list: .env.example).
# Local runs read ./.env; Docker gets the same names from swiftdrop-deploy/docker-compose.yml.
# Tests never use these database settings: they run against Testcontainers (see IntegrationTest).
spring:
  application:
    name: swiftdrop-backend
  config:
    import: optional:file:.env[.properties]

  # Neon: DB_URL=jdbc:postgresql://<neon-host>/swiftdrop?sslmode=require (use the direct host, not "-pooler").
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # Small pool: 9 developers share one Neon database, and Neon limits connections.
    # minimum-idle 0 lets the pool (and Neon's compute) go idle; 30 s covers a Neon cold start.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000        # 60 s (Hikari takes milliseconds)
      max-lifetime: 300000       # 5 min
      connection-timeout: 30000  # 30 s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # One folder per module under db/migration (identity/, merchants/, ...). Each module's tables live in its own
  # schema; the history table stays in public. Teammates on different branches share one database, so:
  # out-of-order applies an older-timestamp migration merged later, and "missing"/"future" migrations from
  # other branches are ignored instead of failing validation.
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    out-of-order: true
    ignore-migration-patterns: "*:missing,*:future"
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  # SMTP. Local default: Mailpit (no auth). Shared setup: Gmail with an App Password (see .env.example).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      # 10 s each, so a blocked port or a stuck server fails quickly (and /actuator/health never hangs).
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      # MAIL_DEBUG=true prints the whole SMTP conversation to the console, INCLUDING the base64-encoded
      # username and password. Only for local troubleshooting; never share that output.
      "[mail.debug]": ${MAIL_DEBUG:false}

# Every log line carries the request's correlation id (CorrelationIdFilter, header X-Correlation-Id).
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

# Only the health endpoint is exposed, without details.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

swiftdrop:
  security:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    cookie-secure: ${COOKIE_SECURE:false}
    jwt:
      secret: ${JWT_SECRET:}
      expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
      remember-me-days: ${JWT_REMEMBER_ME_DAYS:7}
    # "Continue with Google" is on only when both are set.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    # HMAC key for stored email codes. Empty: derived from JWT_SECRET.
    verification-codes:
      secret: ${VERIFICATION_CODE_SECRET:}
    # Per client IP; over the limit -> 429 TOO_MANY_REQUESTS with Retry-After.
    rate-limit:
      login: { requests: 10, window: 1m }
      register: { requests: 10, window: 10m }
      verify: { requests: 10, window: 1m }
      resend: { requests: 5, window: 1m }
      forgot: { requests: 5, window: 1m }
      reset: { requests: 10, window: 1m }
      change: { requests: 10, window: 1m }
  # Sign-up email checks: disposable domains are always rejected; EMAIL_MX_CHECK=false skips the DNS (MX) lookup.
  email-checks:
    mx-enabled: ${EMAIL_MX_CHECK:true}
  mail:
    from: ${MAIL_FROM:no-reply@swiftdrop.lk}
    from-name: SwiftDrop
  seed:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    demo-users: ${SEED_DEMO_USERS:false}
    demo-password: ${DEMO_PASSWORD:}
  # TEMPORARY - delete when WP8 implements AssignmentApi.
  # true: courier endpoints use an in-memory FakeAssignmentApi (courier tasks). With SEED_DEMO_USERS=true and a local
  # database, DemoCourierSeeder creates real demo parcels on every start and gives courier@swiftdrop.lk demo PICKUP,
  # TRANSFER and DELIVERY tasks. On any other database (e.g. Neon) it writes nothing. Local demos only.
  dev:
    fake-dispatch: ${SWIFTDROP_FAKE_DISPATCH:false}
